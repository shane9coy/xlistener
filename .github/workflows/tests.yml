name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile all sources
        run: python -m py_compile webhook_listener.py mirror.py x_budget.py threads_poster.py tools/*.py tests/*.py

      - name: Unit tests
        # Every suite is offline: no credentials, no network, no X or Meta calls.
        run: |
          set -e
          for f in tests/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Tools respond to --help
        run: |
          set -e
          for t in tools/doctor.py tools/resolve_user_id.py tools/setup_xaa.py tools/threads_oauth.py tools/refresh_threads_token.py tools/replay_backlog.py; do
            python "$t" --help > /dev/null
          done
